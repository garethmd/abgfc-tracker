[project]
name = "abgfc-backend"
version = "0.1.0"
description = "ABGFC Blues team stats API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "sqlalchemy>=2.0.52",
    "alembic>=1.20",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "argon2-cffi>=25.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "httpx2>=2.12",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
