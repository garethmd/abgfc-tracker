#cloud-config
# Provisions a fresh Ubuntu 24.04 droplet for ABGFC. Used by `make droplet` (doctl) -
# the SSH public key is substituted in before sending. Idempotent enough to re-run by hand.
#
# What it sets up: a non-root `deploy` user (key-only), ufw 22/80/443, unattended
# security upgrades, fail2ban, Docker + compose plugin, a 2GB swap file (1GB droplet),
# and the app checkout at /opt/abgfc with the data directory at /data.

users:
  - name: deploy
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - __SSH_PUBLIC_KEY__

package_update: true
package_upgrade: true
packages:
  - ufw
  - fail2ban
  - unattended-upgrades
  - ca-certificates
  - curl
  - git
  - sqlite3

write_files:
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
  - path: /etc/apt/apt.conf.d/52unattended-upgrades-local
    content: |
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:30";
  - path: /etc/fail2ban/jail.local
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      bantime = 1h
  - path: /etc/ssh/sshd_config.d/99-abgfc.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      KbdInteractiveAuthentication no

runcmd:
  # Swap: 1GB of RAM is enough to run the stack, not to survive a spike without it.
  - fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - sysctl -w vm.swappiness=10 && echo 'vm.swappiness=10' > /etc/sysctl.d/99-swap.conf
  # Docker from Docker's own repository (Ubuntu's package lags and lacks the compose plugin).
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable --now docker
  # Firewall: SSH, HTTP (for the ACME challenge + redirect) and HTTPS only.
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - systemctl restart ssh
  - systemctl enable --now fail2ban
  # App checkout + data dir. Secrets go in /opt/abgfc/.env afterwards (never in git).
  - mkdir -p /data/media /data/backups && chown -R deploy:deploy /data && chmod 750 /data
  - git clone https://github.com/garethmd/abgfc-tracker.git /opt/abgfc
  - chown -R deploy:deploy /opt/abgfc
  - touch /var/lib/cloud/abgfc-ready
